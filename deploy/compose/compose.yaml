# SPDX-License-Identifier: Apache-2.0
# Evaluate the platform in ~15 minutes: the platform (api, worker, hook) + PostgreSQL + RustFS (S3 with Object Lock,
# Apache-2.0) + Keycloak (OIDC sign-in with demo users). `--profile full` adds Dependency-Track.
#   deploy/compose/setup.sh                      # secrets, then `docker compose up`, then the demo world
# Not for production: use the Helm chart (charts/fortproof) or your own platform with managed PostgreSQL and S3.
name: aap

x-aap: &aap
  image: ${AAP_IMAGE:-ghcr.io/cipherfort/fortproof:latest}
  user: "10001:10001"
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  environment:
    AAP_CONFIG_FILE: /etc/aap/aap.yaml
    AAP_SECRETS_DIR: /var/run/secrets/aap
    AWS_SHARED_CREDENTIALS_FILE: /var/run/secrets/aap/aws-credentials
    HOME: /tmp
  volumes:
    - ./aap.yaml:/etc/aap/aap.yaml:ro
    - ./rules:/etc/aap-rules:ro   # your own rules (only the files you change); aap.yaml sets rules.dir
    - aap-secrets:/var/run/secrets/aap:ro
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  # Docker file secrets keep the host's owner; the platform refuses secrets readable by others. This copies them into
  # a volume owned by the platform's user, mode 0400.
  secrets:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "cp /in/* /out/ && chown 10001:10001 /out/* && chmod 0400 /out/*"]
    volumes: [./secrets:/in:ro, aap-secrets:/out]
    network_mode: none

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment: { POSTGRES_DB: aap, POSTGRES_PASSWORD_FILE: /run/secrets/pg }
    secrets: [{ source: pg, target: pg }]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 3s, retries: 30 }

  rustfs:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    command: ["/data"]
    env_file: [./secrets/rustfs.env]
    volumes: [s3:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://localhost:8180"]
    env_file: [./secrets/keycloak.env]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]
    ports: ["127.0.0.1:8180:8180"]

  migrate:
    <<: *aap
    command: ["sh", "-c", "aap migrate && aap config load --git-sha compose && aap db provision-logins all --from-store && aap storage init-s3 --retention-days 30"]
    environment:
      AAP_CONFIG_FILE: /etc/aap/aap.yaml
      AAP_SECRETS_DIR: /var/run/secrets/aap
      AWS_SHARED_CREDENTIALS_FILE: /var/run/secrets/aap/aws-credentials
      AAP_DATABASE_URL_FILE: /var/run/secrets/aap/database-url
      HOME: /tmp
    depends_on:
      secrets: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }

  api:
    <<: *aap
    command: ["aap", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AAP_CONFIG_FILE: /etc/aap/aap.yaml
      AAP_SECRETS_DIR: /var/run/secrets/aap
      AWS_SHARED_CREDENTIALS_FILE: /var/run/secrets/aap/aws-credentials
      AAP_DATABASE_URL_FILE: /var/run/secrets/aap/database-url-api
      HOME: /tmp
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *aap
    command: ["aap", "worker"]
    environment:
      AAP_CONFIG_FILE: /etc/aap/aap.yaml
      AAP_SECRETS_DIR: /var/run/secrets/aap
      AWS_SHARED_CREDENTIALS_FILE: /var/run/secrets/aap/aws-credentials
      AAP_DATABASE_URL_FILE: /var/run/secrets/aap/database-url-worker
      HOME: /tmp

  hook:
    <<: *aap
    profiles: [webhooks]   # only when GitHub/GitLab can reach this machine
    command: ["aap", "hook", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      AAP_CONFIG_FILE: /etc/aap/aap.yaml
      AAP_SECRETS_DIR: /var/run/secrets/aap
      AAP_DATABASE_URL_FILE: /var/run/secrets/aap/database-url-hook
      HOME: /tmp
    ports: ["127.0.0.1:8001:8001"]

  dependency-track:
    profiles: [full]
    image: dependencytrack/apiserver:4.14.5
    environment: { ALPINE_DATABASE_MODE: embedded }
    volumes: [dtrack:/data]
    ports: ["127.0.0.1:8081:8080"]

secrets:
  pg: { file: ./secrets/pg-password }

volumes: { pg: {}, s3: {}, dtrack: {}, aap-secrets: {} }
